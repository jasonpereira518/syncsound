# Render Blueprint: the SyncSound room server (apps/server) as one free web service with WebSockets.
# Render → New → Blueprint → pick this repo. Step-by-step: docs/DEPLOY.md ("Server on Render (free)").
services:
  - type: web
    name: syncsound-server
    runtime: node
    plan: free
    # one instance only: every room lives in this process's memory
    numInstances: 1
    # root tools (tsx for `start` and `demo`) + the server and its workspace packages; not the web app or the sim
    buildCommand: npx -y pnpm@10.28.2 install --frozen-lockfile --filter syncsound --filter "@syncsound/server..." && npx -y pnpm@10.28.2 demo
    startCommand: node_modules/.bin/tsx apps/server/src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # comma-separated web origins allowed to open the WebSocket, e.g. https://sync-sound.vercel.app
      # (empty = any origin). Set it in the dashboard after the first deploy.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ROOM_TTL_MINUTES
        value: "60"
